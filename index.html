<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>履歴書作成</title>
<style>
:root{--k:#000;--bg:#303030;--pn:#2b2b2b;--ln:#1a1a1a;--fd:#1d1d1d;--bt:#545454;--bh:#656565;--tx:#d9d9d9;--ac:#4772b3;color-scheme:dark}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--k);font-family:"ＭＳ 明朝","MS Mincho","ＭＳ Ｐ明朝","MS PMincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:10pt}
[hidden]{display:none!important}
.bar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;font-family:sans-serif;background:var(--pn);border-bottom:1px solid var(--ln);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.bar button{flex:1 1 0;min-width:0;font:inherit;font-size:15px;padding:12px 0;border:0;border-right:1px solid var(--ln);background:var(--pn);color:var(--tx);cursor:pointer;white-space:nowrap}
.bar button:last-child{border-right:0}
.bar button:hover{background:#3d3d3d}
.bar button.on{background:var(--ac);color:#fff}
.off{position:absolute;opacity:0;pointer-events:none;height:0;overflow:hidden;top:0;left:0}
.vw{padding:64px 16px 24px;font-family:sans-serif;color:var(--tx)}
#tx{display:block;width:100%;max-width:900px;margin:0 auto;min-height:calc(100vh - 100px);min-height:calc(100dvh - 100px);padding:12px;font:16px/1.6 "Yu Gothic","Meiryo",sans-serif;border:1px solid var(--ln);border-radius:4px;background:var(--fd);color:var(--tx);resize:vertical;outline:none}
#tx:focus,.set input:focus{border-color:var(--ac)}
.set{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.set input{font:inherit;font-size:16px;padding:10px;border:1px solid var(--ln);border-radius:4px;background:var(--fd);color:var(--tx);width:100%;outline:none}
.set button{font:inherit;font-size:16px;padding:12px;border:1px solid var(--ln);border-radius:4px;background:var(--bt);color:#fff;cursor:pointer}
.set button:hover{background:var(--bh)}
.wrap{display:flex;flex-direction:row;width:1190.64pt;margin:52px auto 12px;box-shadow:0 2px 12px rgba(0,0,0,.5);background:#fff}
.page{position:relative;width:595.32pt;height:841.92pt;background:#fff;overflow:hidden;flex:none}
.page+.page{transform:translateX(-0.18pt)}
.sv{position:absolute;left:0;top:0;display:block;pointer-events:none}
.tk{fill:#000;stroke:#000;stroke-width:.4px;vector-effect:non-scaling-stroke}
.tn{fill:#000;stroke:#808080;stroke-width:.4px;vector-effect:non-scaling-stroke}
.sv text{white-space:pre;font-kerning:none;text-rendering:geometricPrecision;fill:#000}
.sv text.p{font-family:"MS PMincho","ＭＳ Ｐ明朝","MS Mincho","ＭＳ 明朝","Noto Serif JP",serif}
.sv text.m{font-family:"MS Mincho","ＭＳ 明朝","Noto Serif JP",serif}
.a{position:absolute}
.bx{position:absolute;left:0;top:0;width:483.84pt;transform-origin:0 0}
.bx .bs{overflow:visible}
.ed,.dt,.bh{text-rendering:geometricPrecision;font-kerning:none}
.ed{position:absolute;display:block;padding:1.73pt 4.3pt;line-height:1.45;white-space:pre-wrap;overflow:hidden;outline:none;font-size:10pt}
.fu{font-size:8pt}
[data-k^="ey"],[data-k^="em"],[data-k^="qy"],[data-k^="qm"]{text-align:center}
.vc{display:grid;align-content:center;padding-top:0;padding-bottom:0}
.dt,.bh{font-family:"MS PMincho","ＭＳ Ｐ明朝","MS Mincho","ＭＳ 明朝","Noto Serif JP",serif;font-size:1000pt;line-height:1;white-space:pre;transform-origin:0 0;letter-spacing:-1.1pt}
.il{display:inline-block;text-align:center;outline:none;white-space:pre}
.bh{outline:none}
.photo{cursor:pointer;overflow:hidden}
.photo img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
@page{size:A3 landscape;margin:0}
@media print{
.vw{display:none!important}
.wrap.off{position:static!important;opacity:1!important;pointer-events:auto!important;height:auto!important;overflow:visible!important}
.tk,.tn{stroke:none}
body{background:#fff}
.bar{display:none}
.wrap{margin:0;box-shadow:none;zoom:1!important}
}
</style>

function fields(){return Array.prototype.slice.call(document.querySelectorAll("[data-k]"));}
function load(){
try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");fields().forEach(function(el){var v=s[el.dataset.k];if(v===undefined)return;if(el.dataset.k==="birth"&&v==="年　　　月　　　日生（満　　歳）")return;el.innerText=v;});}catch(e){}
}
function save(){
try{var o={};fields().forEach(function(el){o[el.dataset.k]=el.innerText;});localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}
}
load();
alignAll();
document.addEventListener("input",function(e){if(e.target===tx||e.target===fn)return;align(e.target);layout();save();pushText();});
document.addEventListener("paste",function(e){
if(e.target&&e.target.isContentEditable){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData("text");document.execCommand("insertText",false,t);}
});
var SINGLE=[["furi","ふりがな"],["name","氏名"],["sex","性別"],["afuri","住所ふりがな"],["zip","郵便"],["addr","現住所"],["tel","TEL"],["mail","E-mail"],["cfuri","連絡ふりがな"],["alt","連絡先"],["ctel","連絡TEL"],["cmail","連絡E-mail"]];
var TAIL=[["motive","志望の動機"],["pr","自己PR"],["study","学生時代の取り組み"]];
function byKey(k){return document.querySelector('[data-k="'+k+'"]');}
function val(k){var el=byKey(k);return el?el.innerText.replace(/\n+$/,""):"";}
function setv(k,v){var el=byKey(k);if(el)el.innerText=v;}
function nz(s){s=(s||"").trim();return s==="null"?"":s;}
function nums(s){return s.split(/[,、]/).map(function(x){return x.trim();});}
function entry(line){var m=line.match(/^\s*([^,]*?)\s*,\s*([^,]*?)\s*,\s*(.*?)\s*$/);if(m)return{y:nz(m[1]),m:nz(m[2]),c:nz(m[3])};return{y:"",m:"",c:nz(line)};}
function align(el){
if(!el||!el.dataset||!/^ec\d+$/.test(el.dataset.k||""))return;
var t=el.innerText.trim();
el.style.textAlign=(t==="学歴"||t==="職歴")?"center":(t==="以上"?"right":"");
}
function alignAll(){fields().forEach(align);}
var BX=["bx1","bx2","bx3"];
function boxD(H){
var r=[[0,0,.84,H],[483,.84,483.84,H],[.84,0,483.84,.84],[.84,24.12,483.84,24.96],[.84,H-.84,483.84,H]];
return r.map(function(a){return "M"+a[0]+" "+a[1]+"H"+a[2]+"V"+a[3]+"H"+a[0]+"Z";}).join("");
}
function layout(){
var w=document.getElementById("wrap"),z=w.style.zoom,y=229.56,T=3*95.64,L=[],S=0,P=0,fs=10;
w.style.zoom=1;
BX.forEach(function(id){
var f=document.getElementById(id).querySelector(".ed"),n=1,cs;
f.style.lineHeight=2.1;
cs=getComputedStyle(f);
P=(parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom))*.75;
fs=parseFloat(cs.fontSize)*.75;
if(f.innerText.trim()!==""){
f.style.height="auto";
n=Math.max(1,Math.round((f.getBoundingClientRect().height*.75-P)/(fs*2.1)));
}
L.push(n);S+=n;
});
var lh=Math.max(fs,Math.min(fs*2.1,(T-3*P)/S));
BX.forEach(function(id,i){
var b=document.getElementById(id),f=b.querySelector(".ed"),bh=(T-3*P)*L[i]/S+P;
f.style.lineHeight=lh/fs;
f.style.height=bh+"pt";
var H=24.96+bh+.84,s=b.querySelector("svg");
s.setAttribute("height",H+"pt");
s.setAttribute("viewBox","0 0 483.84 "+H);
s.querySelector("path").setAttribute("d",boxD(H));
b.style.transform="translate(61.92pt,"+y+"pt)";
y+=H+7.2;
});
document.getElementById("bx4").style.transform="translate(61.92pt,"+y+"pt)";
w.style.zoom=z;
}
function parse(text){
var secs=[],cur=null;
text.replace(/^﻿/,"").split(/\r?\n/).forEach(function(l){
var h=l.match(/^\s*\[([^\]]+)\]\s*$/);
if(h){cur={name:h[1].trim(),lines:[]};secs.push(cur);return;}
if(cur)cur.lines.push(l);
});
secs.forEach(function(s){
while(s.lines.length&&s.lines[s.lines.length-1].trim()==="")s.lines.pop();
while(s.lines.length&&s.lines[0].trim()==="")s.lines.shift();
});
return secs;
}
function applyImport(secs,full){
var sec={},n;
if(full)resetAll();
secs.forEach(function(x){sec[x.name]=x;});
SINGLE.concat(TAIL).forEach(function(a){if(sec[a[1]])setv(a[0],sec[a[1]].lines.join("\n"));});
var d=sec["作成年月日"];
if(d){var dn=nums(d.lines[0]||"");setv("dy",dn[0]||"");setv("dm",dn[1]||"");setv("dd",dn[2]||"");}
var b=sec["生年月日と満年齢"];
if(b){var bn=nums(b.lines[0]||"");setv("birth",bn.length>3?bn[0]+" 年 "+bn[1]+" 月 "+bn[2]+" 日生 （満 "+bn[3]+" 歳）":BIRTH0);}
var edu=sec["学歴"],work=sec["職歴"];
if(edu||work){
var rows=[];
if(edu){rows.push({y:"",m:"",c:"学歴"});edu.lines.forEach(function(l){rows.push(entry(l));});}
if(work){if(edu)rows.push({y:"",m:"",c:""});rows.push({y:"",m:"",c:"職歴"});work.lines.forEach(function(l){rows.push(entry(l));});}
if(rows[rows.length-1].c!=="以上")rows.push({y:"",m:"",c:"以上"});
for(n=0;n<eduRows;n++){var r=rows[n]||{y:"",m:"",c:""};setv("ey"+n,r.y);setv("em"+n,r.m);setv("ec"+n,r.c);}
}
var q=sec["資格・免許"];
if(q){for(n=0;n<qualRows;n++){var e=q.lines[n]!==undefined?entry(q.lines[n]):{y:"",m:"",c:""};setv("qy"+n,e.y);setv("qm"+n,e.m);setv("qc"+n,e.c);}}
var w=sec["本人希望"];
if(w){for(n=0;n<wishRows;n++){setv("w"+n,w.lines[n]!==undefined?w.lines[n].trim():"");}}
alignAll();layout();save();
}
function ent(y,m,c){return (y||"null")+", "+(m||"null")+", "+c;}
function buildText(){
var o=[],n;
function sec(t,v){o.push("["+t+"]");if(v!=="")o.push(v);}
function one(t,k){sec(t,val(k));}
function gap(){o.push("");}
var dd=[val("dy"),val("dm"),val("dd")].map(function(x){return x.trim();});
sec("作成年月日",dd.join("")===""?"":dd.join(", "));
one("ふりがな","furi");
one("氏名","name");
var bm=val("birth").match(/(\d+)\D+(\d+)\D+(\d+)\D+(\d+)/);
sec("生年月日と満年齢",bm?bm.slice(1,5).join(", "):"");
one("性別","sex");
one("住所ふりがな","afuri");
one("郵便","zip");
one("現住所","addr");
one("TEL","tel");
one("E-mail","mail");
one("連絡ふりがな","cfuri");
one("連絡先","alt");
one("連絡TEL","ctel");
one("連絡E-mail","cmail");
gap();
var st="学歴",L={"学歴":[],"職歴":[]};
for(n=0;n<eduRows;n++){
var y=val("ey"+n).trim(),m=val("em"+n).trim(),c=val("ec"+n).trim();
if(c==="学歴"||c==="職歴"){st=c;continue;}
if(c==="以上"||(!y&&!m&&!c))continue;
L[st].push(ent(y,m,c));
}
sec("学歴",L["学歴"].join("\n"));
sec("職歴",L["職歴"].join("\n"));
gap();
var Q=[];
for(n=0;n<qualRows;n++){var qy=val("qy"+n).trim(),qm=val("qm"+n).trim(),qc=val("qc"+n).trim();if(qy||qm||qc)Q.push(ent(qy,qm,qc));}
sec("資格・免許",Q.join("\n"));
gap();
TAIL.forEach(function(a){sec(a[1],val(a[0]));gap();});
var W=[];
for(n=0;n<wishRows;n++){var t=val("w"+n).trim();if(t)W.push(t);}
sec("本人希望",W.join("\n"));
return o.join("\r\n");
}
var tx=document.getElementById("tx"),fn=document.getElementById("fn"),curView="resume",touched=false;
var BIRTH0="年　　　　　月　　　　　日生　（満　　　歳）　";
function resetAll(){fields().forEach(function(el){el.innerText="";});setv("birth",BIRTH0);}
function pad(n){return (n<10?"0":"")+n;}
function stamp(){var d=new Date();return pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes());}
function autoName(){if(!touched)fn.value="履歴書_"+stamp()+".pdf";}
function pushText(){if(document.activeElement!==tx)tx.value=buildText();}
function setView(v){
curView=v;
document.getElementById("wrap").classList.toggle("off",v!=="resume");
document.getElementById("v-in").hidden=v!=="in";
document.getElementById("v-set").hidden=v!=="set";
document.getElementById("tb-r").classList.toggle("on",v==="resume");
document.getElementById("tb-i").classList.toggle("on",v==="in");
document.getElementById("tb-s").classList.toggle("on",v==="set");
if(v==="in")pushText();
if(v==="set")autoName();
if(v==="resume")layout();
window.scrollTo(0,0);
fit();
}
function importTxt(text){applyImport(parse(text),true);pushText();}
window.__resume={imp:importTxt,exp:buildText,view:setView,type:function(s){tx.value=s;tx.dispatchEvent(new Event("input",{bubbles:true}));}};
function go(v){if(v!==curView)location.replace("?v="+v);}
document.getElementById("tb-r").addEventListener("click",function(){go("resume");});
document.getElementById("tb-i").addEventListener("click",function(){go("in");});
document.getElementById("tb-s").addEventListener("click",function(){go("set");});
tx.addEventListener("input",function(){applyImport(parse(tx.value),true);});
fn.addEventListener("input",function(){touched=true;try{sessionStorage.setItem(FKEY,fn.value);}catch(e){}});
document.getElementById("print").addEventListener("click",function(){
autoName();
var n=fn.value.replace(/[.]pdf$/i,"").trim()||"履歴書",old=document.title;
document.title=n;
layout();
window.print();
document.title=old;
});
var photo=document.getElementById("photo"),pimg=document.getElementById("pimg"),pfile=document.getElementById("pfile"),PKEY="create-resume-photo-v1";
var phs=document.getElementById("phs"),FKEY="create-resume-fn-v1";
function showPhoto(src){
if(src){pimg.src=src;pimg.hidden=false;photo.classList.add("has");phs.style.display="none";}
else{pimg.removeAttribute("src");pimg.hidden=true;photo.classList.remove("has");phs.style.display="";}
}
try{localStorage.removeItem(PKEY);}catch(e){}
try{var sp=sessionStorage.getItem(PKEY);if(sp)showPhoto(sp);}catch(e){}
try{var sf=sessionStorage.getItem(FKEY);if(sf){fn.value=sf;touched=true;}}catch(e){}
photo.addEventListener("click",function(e){if(e.target!==pfile)pfile.click();});
pfile.addEventListener("click",function(e){e.stopPropagation();});
pfile.addEventListener("change",function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var url=URL.createObjectURL(f),im=new Image();
im.onload=function(){
var r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
var d=c.toDataURL("image/jpeg",.92);
URL.revokeObjectURL(url);
showPhoto(d);
try{sessionStorage.setItem(PKEY,d);}catch(x){}

};
im.src=url;
e.target.value="";
});
photo.addEventListener("contextmenu",function(e){
if(!photo.classList.contains("has"))return;
e.preventDefault();
if(confirm("写真を削除します。よろしいですか。")){showPhoto("");try{sessionStorage.removeItem(PKEY);}catch(x){}}
});
function fit(){
var vp=document.querySelector('meta[name="viewport"]');
vp.setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no");
document.getElementById("wrap").style.zoom=baseZ()*U;
}
function baseZ(){return Math.min(1,(window.innerWidth-16)/1587.52);}
var U=1,pd=0,pu=1;
function tdist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
function zoomAt(nu,cx,cy){
var w=document.getElementById("wrap"),f=baseZ(),old=parseFloat(w.style.zoom)||f;
nu=Math.max(1,Math.min(nu,2.5/f));
var nz=f*nu,px=(window.scrollX+cx)/old,py=(window.scrollY+cy)/old;
U=nu;w.style.zoom=nz;
window.scrollTo(px*nz-cx,py*nz-cy);
}
document.addEventListener("touchstart",function(e){if(curView==="resume"&&e.touches.length===2){pd=tdist(e.touches);pu=U;}},{passive:true});
document.addEventListener("touchmove",function(e){
if(curView!=="resume"||e.touches.length!==2||!pd)return;
e.preventDefault();
zoomAt(pu*tdist(e.touches)/pd,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);
},{passive:false});
document.addEventListener("touchend",function(e){if(e.touches.length<2)pd=0;},{passive:true});
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){setTimeout(fit,300);});
tx.value=buildText();
layout();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
window.addEventListener('load',layout);
window.addEventListener('beforeprint',layout);
var q0=(location.search.match(/[?&]v=(in|set)\b/)||[])[1];
if(q0)setView(q0);else fit();
})();
</script>
</body>
</html>
