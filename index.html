.bh{outline:none}

@page{size:A3 landscape;margin:0}
@media print{
.tk,.tn{stroke:none}

name=ALIAS[name.replace(/\s/g,"")]||name;
cur={name:name,lines:[]};secs.push(cur);
if(rest.trim()!=="")cur.lines.push(rest);
return;
}
var o=l.match(/^[^\[=]*\[([A-Za-z0-9_]+)\]=(.*)$/);
if(o){legacy[o[1]]=unesc(o[2]);cur=null;return;}
if(cur)cur.lines.push(l);
});
secs.forEach(function(s){
while(s.lines.length&&s.lines[s.lines.length-1].trim()==="")s.lines.pop();
while(s.lines.length&&s.lines[0].trim()==="")s.lines.shift();
});
return{secs:secs,legacy:legacy};
}
function applyImport(p){
var sec={},n;
p.secs.forEach(function(x){sec[x.name]=x;});
Object.keys(p.legacy).forEach(function(k){setv(k,p.legacy[k]);});
SINGLE.concat(TAIL).forEach(function(a){if(sec[a[1]])setv(a[0],sec[a[1]].lines.join("\n"));});
var edu=sec["学歴"],work=sec["職歴"];
if(edu||work){
var rows=[];
if(edu){rows.push({y:"",m:"",c:"学歴"});edu.lines.forEach(function(l){rows.push(entry(l));});}
if(work){if(edu)rows.push({y:"",m:"",c:""});rows.push({y:"",m:"",c:"職歴"});work.lines.forEach(function(l){rows.push(entry(l));});}
if(rows[rows.length-1].c!=="以上")rows.push({y:"",m:"",c:"以上"});
for(n=0;n<eduRows;n++){var r=rows[n]||{y:"",m:"",c:""};setv("ey"+n,r.y);setv("em"+n,r.m);setv("ec"+n,r.c);}
}
var q=sec["資格・免許"];
if(q){for(n=0;n<qualRows;n++){var e=q.lines[n]!==undefined?entry(q.lines[n]):{y:"",m:"",c:""};setv("qy"+n,e.y);setv("qm"+n,e.m);setv("qc"+n,e.c);}}
var w=sec["本人希望"];
if(w){for(n=0;n<wishRows;n++){setv("w"+n,w.lines[n]!==undefined?w.lines[n].trim():"");}}
alignAll();save();
}
function ent(y,m,c){return (y||"null")+", "+(m||"null")+", "+c;}
function buildText(){
var o=[],n;
function sec(t,v){o.push("["+t+"]");if(v!=="")o.push(v);o.push("");}
SINGLE.forEach(function(a){sec(a[1],val(a[0]));});
var st="学歴",L={"学歴":[],"職歴":[]};
for(n=0;n<eduRows;n++){
var y=val("ey"+n).trim(),m=val("em"+n).trim(),c=val("ec"+n).trim();
if(c==="学歴"||c==="職歴"){st=c;continue;}
if(c==="以上"||(!y&&!m&&!c))continue;
L[st].push(ent(y,m,c));
}
sec("学歴",L["学歴"].join("\n"));
sec("職歴",L["職歴"].join("\n"));
var Q=[];
for(n=0;n<qualRows;n++){var qy=val("qy"+n).trim(),qm=val("qm"+n).trim(),qc=val("qc"+n).trim();if(qy||qm||qc)Q.push(ent(qy,qm,qc));}
sec("資格・免許",Q.join("\n"));
TAIL.forEach(function(a){sec(a[1],val(a[0]));});
var W=[];
for(n=0;n<wishRows;n++){var t=val("w"+n).trim();if(t)W.push(t);}
sec("本人希望",W.join("\n"));
return o.join("\r\n");
}
function exportTxt(){
var a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([buildText()],{type:"text/plain;charset=utf-8"}));
a.download="履歴書.txt";
document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importTxt(text){applyImport(parse(text));}
window.__resume={imp:importTxt,exp:buildText};
document.getElementById("exp").addEventListener("click",exportTxt);
document.getElementById("imp").addEventListener("click",function(){document.getElementById("file").click();});
document.getElementById("file").addEventListener("change",function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){importTxt(String(r.result));};
r.readAsText(f,"utf-8");
e.target.value="";
});
document.getElementById("print").addEventListener("click",function(){window.print();});
var photo=document.getElementById("photo"),pimg=document.getElementById("pimg"),pfile=document.getElementById("pfile"),PKEY="create-resume-photo-v1";
var phs=document.getElementById("phs");
function showPhoto(src){
if(src){pimg.src=src;pimg.hidden=false;photo.classList.add("has");phs.style.display="none";}
else{pimg.removeAttribute("src");pimg.hidden=true;photo.classList.remove("has");phs.style.display="";}
}
try{showPhoto(localStorage.getItem(PKEY)||"");}catch(e){}
photo.addEventListener("click",function(e){if(e.target!==pfile)pfile.click();});
pfile.addEventListener("click",function(e){e.stopPropagation();});
pfile.addEventListener("change",function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var url=URL.createObjectURL(f),im=new Image();
im.onload=function(){
var r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
var d=c.toDataURL("image/jpeg",.92);
URL.revokeObjectURL(url);
showPhoto(d);
try{localStorage.setItem(PKEY,d);}catch(x){}
};
im.src=url;
e.target.value="";
});
photo.addEventListener("contextmenu",function(e){
if(!photo.classList.contains("has"))return;
e.preventDefault();
if(confirm("写真を削除します。よろしいですか。")){showPhoto("");try{localStorage.removeItem(PKEY);}catch(x){}}
});
var W=Math.ceil(1190.64*96/72),bar=document.querySelector(".bar"),touch=navigator.maxTouchPoints>0;
function stick(){
var vv=window.visualViewport;
if(!vv){bar.style.width="100%";return;}
var k=vv.scale;
var f=.6;
bar.style.width=(vv.width*k/f)+"px";
bar.style.transform="translate("+vv.offsetLeft+"px,"+vv.offsetTop+"px) scale("+(f/k)+")";
}
function fit(){
var vp=document.querySelector('meta[name="viewport"]');
if(touch&&Math.min(screen.width,screen.height)<W){
vp.setAttribute("content","width="+W);
document.getElementById("wrap").style.zoom=1;
}else{
vp.setAttribute("content","width=device-width,initial-scale=1");
document.getElementById("wrap").style.zoom=Math.min(1,(window.innerWidth-16)/W);
}
stick();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){setTimeout(fit,300);});
window.addEventListener("scroll",stick);
if(window.visualViewport){window.visualViewport.addEventListener("resize",stick);window.visualViewport.addEventListener("scroll",stick);}
fit();
})();
</script>
