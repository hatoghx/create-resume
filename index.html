<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>履歴書作成</title>
<style>
:root{--ink:#111;--line:#111;--bg:#e9e9ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid #ccc}
.bar button{font:inherit;font-size:14px;padding:8px 18px;border:1px solid #333;background:#fff;border-radius:4px;cursor:pointer}
.bar button.main{background:#111;color:#fff}
.page{width:210mm;min-height:297mm;margin:12px auto;padding:10mm;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.title{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2mm}
h1{margin:0;font-size:20pt;letter-spacing:.8em;font-weight:700}
.date{font-size:9pt}
.top{display:flex;gap:3mm;align-items:flex-start}
.left{flex:1}
.photo{width:30mm;height:40mm;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:7pt;line-height:1.6;flex:none}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td,th{border:1px solid var(--line);padding:0;vertical-align:top;font-weight:400;text-align:left}
.lb{width:18mm;font-size:7pt;padding:1mm 1.2mm;background:#f6f6f6}
.lb.k{font-size:9pt;vertical-align:middle}
.ed{display:block;width:100%;min-height:100%;padding:1mm 1.5mm;font-size:10pt;outline:none;line-height:1.5}
.ed:focus{background:#fffbe0}
.ed.sm{font-size:8.5pt}
.il{display:inline-block;min-width:8mm;padding:0 1mm;outline:none}
.il.w{min-width:14mm}
.h-furi{height:7mm}
.h-name{height:14mm}
.h-name .ed{font-size:16pt}
.h-row{height:8mm}
.h-addr{height:14mm}
.sp{height:3mm}
.yr{width:16mm}
.mo{width:10mm}
.hd{text-align:center;font-size:9pt;font-weight:700;height:8mm;vertical-align:middle;background:#f6f6f6}
.sec{text-align:center;font-weight:700;font-size:9pt;height:8mm;vertical-align:middle;letter-spacing:.8em}
.end{text-align:right;font-size:9pt;padding:1mm 3mm;height:8mm}
.note{font-size:7pt;color:#444;margin:1mm 0 0}
.lbc{width:24mm;font-size:9pt;vertical-align:middle;padding:1mm 1.5mm;background:#f6f6f6}
.box{height:48mm}
.box.m{height:30mm}
.box.s{height:20mm}
.box.t{height:30mm}
.ed.mul{min-height:100%;height:100%;white-space:pre-wrap}
@page{size:A4;margin:0}
@media print{
body{background:#fff}
.bar{display:none}
.page{margin:0;box-shadow:none;width:210mm;min-height:297mm;page-break-after:always}
.page:last-of-type{page-break-after:auto}
.lb,.lbc,.hd{background:none}
.ed:focus{background:none}
}
@media(max-width:800px){
.page{width:100%;padding:4mm;min-height:0}
.top{flex-direction:column-reverse}
.photo{align-self:flex-end}
}
</style>
</head>
<body>
<div class="bar">
<button class="main" id="print">PDFで保存・印刷</button>
<button id="imp">TXT読込</button>
<button id="exp">TXT保存</button>
<button id="clear">入力を消去</button>
<input type="file" id="file" accept=".txt,text/plain" hidden>
</div>
<main>
<section class="page">
<div class="title">
<h1>履歴書</h1>
<div class="date"><span class="il w" contenteditable data-k="dy"></span>年<span class="il" contenteditable data-k="dm"></span>月<span class="il" contenteditable data-k="dd"></span>日現在</div>
</div>
<div class="top">
<div class="left">
<table>
<tr class="h-furi"><td class="lb">ふりがな</td><td colspan="3"><span class="ed sm" contenteditable data-k="furi"></span></td></tr>
<tr><td class="lb k">氏　名</td><td colspan="3" class="h-name"><span class="ed" contenteditable data-k="name"></span></td></tr>
<tr class="h-row"><td class="lb k">生年月日</td><td><span class="ed sm" contenteditable data-k="birth">　　　年　　月　　日生（満　　歳）</span></td><td class="lb k" style="width:14mm">性別</td><td style="width:22mm"><span class="ed sm" contenteditable data-k="sex"></span></td></tr>
<tr class="h-furi"><td class="lb">ふりがな</td><td colspan="3"><span class="ed sm" contenteditable data-k="afuri"></span></td></tr>
<tr class="h-addr"><td class="lb k">現住所</td><td colspan="3"><span class="ed" contenteditable data-k="addr">〒</span></td></tr>
<tr class="h-row"><td class="lb k">電話</td><td colspan="3"><span class="ed sm" contenteditable data-k="tel"></span></td></tr>
<tr class="h-row"><td class="lb k">E-mail</td><td colspan="3"><span class="ed sm" contenteditable data-k="mail"></span></td></tr>
</table>
<p class="note">性別は任意記載です。</p>
</div>
<div class="photo">写真をはる位置<br>縦36〜40mm<br>横24〜30mm</div>
</div>
<div class="sp"></div>
<table>
<tr><th class="hd yr">年</th><th class="hd mo">月</th><th class="hd">学歴・職歴</th></tr>
<tbody id="edu"></tbody>
<tr><td colspan="3" class="end">以上</td></tr>
</table>
<div class="sp"></div>
<table>
<tr><th class="hd yr">年</th><th class="hd mo">月</th><th class="hd">免許・資格</th></tr>
<tbody id="qual"></tbody>
</table>
</section>
<section class="page">
<table>
<tr><td class="lbc">志望の動機</td><td class="box"><span class="ed mul" contenteditable data-k="motive"></span></td></tr>
</table>
<div class="sp"></div>
<table>
<tr><td class="lbc">自己PR</td><td class="box"><span class="ed mul" contenteditable data-k="pr"></span></td></tr>
</table>
<div class="sp"></div>
<table>
<tr><td class="lbc">趣味・特技など</td><td class="box s"><span class="ed mul" contenteditable data-k="skill"></span></td></tr>
</table>
<div class="sp"></div>
<table>
<tr><td class="lbc">本人希望記入欄<br><span style="font-size:7pt">給料・職種・勤務時間・勤務地・その他</span></td><td class="box t"><span class="ed mul" contenteditable data-k="wish">特になし（貴社規定に従います）</span></td></tr>
</table>
<div class="sp"></div>
<table>
<tr><td class="lbc">連絡先<br><span style="font-size:7pt">現住所以外に連絡を希望する場合のみ</span></td><td class="box s"><span class="ed mul" contenteditable data-k="alt"></span></td></tr>
</table>
</section>
</main>
<script>
(function(){
var KEY="create-resume-v2";
var eduDefault=[
["","","学歴"],
["","4","高等学校　入学"],["","3","高等学校　卒業"],
["","4","大学　学部　学科　入学"],["","3","大学　学部　学科　卒業見込み"],
["","","職歴"],["","","なし"]
];
var eduRows=9,qualRows=4;
function cell(cls,k,v){return '<td class="'+cls+'"><span class="ed sm" contenteditable data-k="'+k+'">'+(v||"")+'</span></td>';}
var h="",i,d;
for(i=0;i<eduRows;i++){d=eduDefault[i]||["","",""];h+='<tr class="h-row">'+cell("yr","ey"+i,d[0])+cell("mo","em"+i,d[1])+cell("","ec"+i,d[2])+'</tr>';}
document.getElementById("edu").innerHTML=h;
h="";
for(i=0;i<qualRows;i++){h+='<tr class="h-row">'+cell("yr","qy"+i,"")+cell("mo","qm"+i,"")+cell("","qc"+i,"")+'</tr>';}
document.getElementById("qual").innerHTML=h;
function fields(){return Array.prototype.slice.call(document.querySelectorAll("[data-k]"));}
function load(){
try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");fields().forEach(function(el){if(s[el.dataset.k]!==undefined)el.innerText=s[el.dataset.k];});}catch(e){}
}
function save(){
try{var o={};fields().forEach(function(el){o[el.dataset.k]=el.innerText;});localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}
}
load();
document.addEventListener("input",save);
document.addEventListener("paste",function(e){
if(e.target&&e.target.isContentEditable){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData("text");document.execCommand("insertText",false,t);}
});
var labels={dy:"作成年",dm:"作成月",dd:"作成日",furi:"ふりがな",name:"氏名",birth:"生年月日",sex:"性別",afuri:"住所ふりがな",addr:"現住所",tel:"電話",mail:"E-mail",motive:"志望の動機",pr:"自己PR",skill:"趣味・特技など",wish:"本人希望記入欄",alt:"連絡先"};
for(i=0;i<eduRows;i++){labels["ey"+i]="学歴職歴"+(i+1)+"年";labels["em"+i]="学歴職歴"+(i+1)+"月";labels["ec"+i]="学歴職歴"+(i+1)+"内容";}
for(i=0;i<qualRows;i++){labels["qy"+i]="免許資格"+(i+1)+"年";labels["qm"+i]="免許資格"+(i+1)+"月";labels["qc"+i]="免許資格"+(i+1)+"内容";}
function esc(s){return s.replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n");}
function unesc(s){return s.replace(/\\(\\|n)/g,function(m,c){return c==="n"?"\n":"\\";});}
function exportTxt(){
var out=fields().map(function(el){return (labels[el.dataset.k]||el.dataset.k)+"["+el.dataset.k+"]="+esc(el.innerText.replace(/\n+$/,""));}).join("\r\n")+"\r\n";
var a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([out],{type:"text/plain;charset=utf-8"}));
a.download="履歴書.txt";
document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importTxt(text){
var map={};
text.replace(/^﻿/,"").split(/\r?\n/).forEach(function(l){
var m=l.match(/^[^\[=]*\[([A-Za-z0-9_]+)\]=(.*)$/);
if(m)map[m[1]]=unesc(m[2]);
});
fields().forEach(function(el){if(map[el.dataset.k]!==undefined)el.innerText=map[el.dataset.k];});
save();
}
document.getElementById("exp").addEventListener("click",exportTxt);
document.getElementById("imp").addEventListener("click",function(){document.getElementById("file").click();});
document.getElementById("file").addEventListener("change",function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){importTxt(String(r.result));};
r.readAsText(f,"utf-8");
e.target.value="";
});
document.getElementById("print").addEventListener("click",function(){window.print();});
document.getElementById("clear").addEventListener("click",function(){
if(!confirm("入力内容をすべて消去します。よろしいですか。"))return;
try{localStorage.removeItem(KEY);}catch(e){}
fields().forEach(function(el){el.innerText="";});
});
})();
</script>
</body>
</html>
